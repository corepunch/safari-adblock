# Source of truth for Cardea.xcodeproj. After editing, regenerate with
#   xcodegen          (brew install xcodegen)
# CI also regenerates and commits the project on every push.
name: Cardea
options:
  bundleIdPrefix: com.corepunch
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team ID here (or in Xcode)
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Cardea:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: ["*.entitlements", "Info.plist"]
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        # No custom encryption: skips the export-compliance question on upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.cardea
        PRODUCT_NAME: Cardea
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cardea
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/App.entitlements
    scheme: {}
    dependencies:
      - target: CardeaBlocker
      - target: CardeaVideo
      - sdk: SafariServices.framework

  CardeaBlocker:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Blocker
        excludes: ["*.entitlements", "Info.plist"]
    info:
      path: Blocker/Info.plist
      properties:
        CFBundleDisplayName: Cardea
        NSHumanReadableDescription: Blocks ads and trackers in Safari.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.cardea.Blocker
        PRODUCT_NAME: CardeaBlocker
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Blocker/Blocker.entitlements

  # Optional second extension: removes YouTube video ads with a script.
  # A content blocker can't do this — YouTube serves ads from the same
  # domains as the videos. Named without "YouTube" to stay clear of
  # App Review's trademark rule (5.2.1).
  CardeaVideo:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VideoExtension
        excludes: ["*.entitlements", "Info.plist", "Resources/**"]
      - path: VideoExtension/Resources
        buildPhase: resources
    info:
      path: VideoExtension/Info.plist
      properties:
        CFBundleDisplayName: Cardea Video
        NSHumanReadableDescription: Removes ads from YouTube videos in Safari.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.cardea.Video
        PRODUCT_NAME: CardeaVideo
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": VideoExtension/Video.entitlements
