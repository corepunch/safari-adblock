# Generate the Xcode project with:  xcodegen   (brew install xcodegen)
name: Plain
options:
  bundleIdPrefix: com.corepunch
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team ID here (or in Xcode)
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Plain:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.plain
        PRODUCT_NAME: Plain
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plain
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/App.entitlements
    dependencies:
      - target: PlainBlocker
      - sdk: SafariServices.framework

  PlainBlocker:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Blocker
        excludes: ["*.entitlements"]
    info:
      path: Blocker/Info.plist
      properties:
        CFBundleDisplayName: Plain
        NSHumanReadableDescription: Blocks ads and trackers in Safari.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.plain.Blocker
        PRODUCT_NAME: PlainBlocker
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Blocker/Blocker.entitlements
