name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Test YouTube ad stripping
        run: make test

      - name: Check the rules with Safari's translator and compiler
        run: make check

      - name: Package the extension
        run: make zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cardea
          path: .build/Cardea.zip
